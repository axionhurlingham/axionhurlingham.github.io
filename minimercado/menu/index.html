<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Menú del minimercado · Axion Hurlingham</title>
<!-- QR de las mesas: el QR impreso apunta acá y NO SE CAMBIA NUNCA.
     El menú se muestra adentro. Si el panel cambia de dirección, se cambia
     MENU de abajo (el panel lo controla en Salud). -->
<style>
html,body{margin:0;height:100%;background:#fff}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="menu" title="Menú del minimercado"></iframe>
<noscript><meta http-equiv="refresh" content="0; url=https://axionserver.tailbb853d.ts.net/menu"></noscript>
<script>
var MENU = "https://axionserver.tailbb853d.ts.net/menu";
// Si el celular no puede mostrar el menú adentro (por ejemplo, con Tailscale
// prendido), lo abre directo.
fetch(MENU.replace(/\/menu$/, "/estatico/menu/menu.css"), {mode: "no-cors", cache: "no-store"})
  .then(function () { document.getElementById("menu").src = MENU; })
  .catch(function () { location.replace(MENU); });
</script>
</body>
</html>
